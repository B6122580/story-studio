<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Player</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#f1f2fc;background:#0d111c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(100%,740px);background:#1a2030;border:1px solid #343d54;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 18px 65px #0006}h1{font-size:20px}h2{font-size:16px;color:#b9c3dd}p.story{white-space:pre-wrap;line-height:1.9;min-height:145px;font-size:18px}button,input{font:inherit;width:100%;padding:14px;border-radius:12px;margin:6px 0}button{border:1px solid #646d98;background:#343c62;color:white;cursor:pointer}button:hover{background:#505c90}input{background:#101727;border:1px solid #67708a;color:white}.muted{color:#aab3c7;font-size:13px}.novel{background:linear-gradient(145deg,#34324d,#171d2c)}.chat{background:#192b37}.explore{background:#332b29}.text{background:#2b2928}.detective{background:#302a36}.terminal{background:#071b13;color:#91e9b0;font-family:monospace}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto;padding:8px 12px}.hide{display:none}.end{text-align:center;font-size:24px;padding:20px}

/* Story Studio scene design */
.design-preview{position:relative;isolation:isolate;overflow:hidden;background-color:var(--design-bg,#1a2030);background-image:var(--design-image,none);background-size:cover;background-position:center;color:var(--design-text,#f1f2fc);font-family:var(--design-font,system-ui);aspect-ratio:var(--design-ratio,auto)}
.design-preview:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--design-overlay,.35));z-index:-1;pointer-events:none}
.design-portrait{display:block;width:min(42%,260px);max-height:40vh;object-fit:contain;object-position:bottom;margin:0 auto 12px}
.design-preview .scene,.design-preview .story{color:inherit;text-align:var(--design-align,left);font-size:var(--design-size,18px)}
.design-preview .scene{white-space:pre-wrap}
.design-preview h1,.design-preview h2,.design-preview .muted{color:inherit}
.design-preview button{background:var(--design-button,#343c62);color:var(--design-text,#f1f2fc)}
.design-preview .design-dialog{background:rgba(8,12,23,.68);padding:14px;border-radius:12px;backdrop-filter:blur(3px)}
.design-preview .design-dialog .scene,.design-preview .design-dialog .story{margin-top:8px}
.design-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.design-fields .wide{grid-column:1/-1}
@media(max-width:600px){.design-fields{grid-template-columns:1fr}.design-preview{aspect-ratio:auto;min-height:360px}.design-portrait{max-height:28vh}}

/* Independent typography and embedded image controls */
.design-preview h1,.design-preview h2,.design-preview .scene-heading{color:var(--design-title-color,var(--design-text,#f1f2fc));font-family:var(--design-title-font,var(--design-font,system-ui));font-size:var(--design-title-size,20px)}
.design-preview .scene,.design-preview .story{color:var(--design-body-color,var(--design-text,#f1f2fc));font-family:var(--design-body-font,var(--design-font,system-ui));font-size:var(--design-body-size,var(--design-size,18px))}
.design-preview button{color:var(--design-choice-color,var(--design-text,#f1f2fc));font-family:var(--design-choice-font,var(--design-font,system-ui));font-size:var(--design-choice-size,18px)}
.design-preview .muted{color:var(--design-title-color,var(--design-text,#f1f2fc))}
.upload-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload-tools input[type=file]{max-width:100%;font-size:12px}.upload-tools button{flex:0 0 auto}.upload-note{font-size:12px;color:#abb7d3;overflow-wrap:anywhere}
</style></head><body><main class="shell" id="shell"><div class="top"><h1 id="title">게임 불러오는 중…</h1><button id="reset" class="hide">처음부터</button></div><h2 id="chapter"></h2><div class="design-dialog"><p id="story" class="story"></p></div><div id="actions"></div><p id="notice" class="muted"></p></main><script src="firebase-config.js"></script><script src="cloud.js"></script><script>
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let game,sceneId;const storageKey='storyPlayer:'+id;const error=s=>{$('title').textContent='게임을 열 수 없습니다';$('notice').textContent=s};const esc=s=>String(s||'');
(async()=>{if(!id)return error('게임 링크에 id가 없습니다.');try{const cloud=await StoryCloud;if(!cloud)return error('Firebase 설정이 필요합니다.');const snap=await cloud.getDoc(cloud.doc(cloud.db,'publicGames',id));if(!snap.exists())return error('게임이 없거나 비공개 상태입니다.');game=snap.data();if(!game.published)return error('비공개 게임입니다.');sceneId=localStorage.getItem(storageKey)||game.start;render()}catch(e){error('게임을 불러오지 못했습니다. 공개 여부와 Firebase 규칙을 확인하세요. '+e.message)}})();

const designDefaults={background:'',portrait:'',bgColor:'#1a2030',textColor:'#f1f2fc',buttonColor:'#343c62',fontSize:18,ratio:'auto',font:'system',align:'left',overlay:35};
const designFields={background:'designBackground',portrait:'designPortrait',bgColor:'designBgColor',textColor:'designTextColor',buttonColor:'designButtonColor',fontSize:'designFontSize',ratio:'designRatio',font:'designFont',align:'designAlign',overlay:'designOverlay'};
function safeDesignUrl(value){if(typeof value==='string' && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value))return value;try{if(!value)return '';const u=new URL(value);return u.protocol==='https:'?u.href:''}catch{return ''}}
function getDesign(s){const d={...designDefaults,...(s.design||{})};return {titleColor:d.titleColor||d.textColor,titleFont:d.titleFont||d.font,titleSize:d.titleSize||20,bodyColor:d.bodyColor||d.textColor,bodyFont:d.bodyFont||d.font,bodySize:d.bodySize||d.fontSize,choiceColor:d.choiceColor||d.textColor,choiceFont:d.choiceFont||d.font,choiceSize:d.choiceSize||d.fontSize,...d}}
function applyDesign(el,s){const d=getDesign(s);const color=(v,def)=>/^#[0-9a-fA-F]{6}$/.test(v)?v:def;el.classList.add('design-preview');el.style.setProperty('--design-bg',color(d.bgColor,'#1a2030'));el.style.setProperty('--design-text',color(d.textColor,'#f1f2fc'));el.style.setProperty('--design-button',color(d.buttonColor,'#343c62'));el.style.setProperty('--design-image',safeDesignUrl(d.background)?`url("${safeDesignUrl(d.background)}")`:'none');el.style.setProperty('--design-overlay',String(Math.max(0,Math.min(.85,(Number(d.overlay)||0)/100))));el.style.setProperty('--design-size',Math.max(12,Math.min(36,Number(d.fontSize)||18))+'px');el.style.setProperty('--design-ratio',['auto','16/9','4/3','9/16','1/1'].includes(d.ratio)?d.ratio:'auto');el.style.setProperty('--design-align',['left','center','right'].includes(d.align)?d.align:'left');el.style.setProperty('--design-font',d.font==='serif'?"Georgia, 'Batang', serif":d.font==='mono'?'monospace':'system-ui, sans-serif');const font=v=>v==='serif'?"Georgia, 'Batang', serif":v==='mono'?'monospace':'system-ui, sans-serif';for(const part of ['title','body','choice']){el.style.setProperty('--design-'+part+'-color',color(d[part+'Color'],d.textColor));el.style.setProperty('--design-'+part+'-font',font(d[part+'Font']));el.style.setProperty('--design-'+part+'-size',Math.max(12,Math.min(56,Number(d[part+'Size'])||18))+'px')}const img=safeDesignUrl(d.portrait);if(img){const portrait=document.createElement('img');portrait.src=img;portrait.alt='캐릭터 이미지';portrait.className='design-portrait';const target=el.querySelector('.design-dialog')||el.querySelector('.scene');if(target)target.before(portrait)}}

function render(){const scene=game.scenes.find(s=>s.id===sceneId);if(!scene){sceneId=game.start;localStorage.removeItem(storageKey);return render()}localStorage.setItem(storageKey,sceneId);$('shell').className='shell '+(scene.style||'novel');$('shell').style.cssText='';$('shell').querySelectorAll('.design-portrait').forEach(x=>x.remove());$('title').textContent=game.title;$('chapter').textContent=scene.title;$('story').textContent=scene.body||'';applyDesign($('shell'),scene);$('reset').classList.remove('hide');$('notice').textContent='진행 상황은 이 브라우저에 자동 저장됩니다.';const a=$('actions');a.replaceChildren();const button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)};const next=(target)=>{if(!target||!game.scenes.some(s=>s.id===target))return $('notice').textContent='다음 장면이 연결되지 않았습니다.';sceneId=target;render()};if(scene.type==='ending'){const d=document.createElement('div');d.className='end';d.textContent='✦ ENDING ✦';a.append(d);button('다시 시작',()=>{sceneId=game.start;render()})}else if(scene.type==='puzzle'){const inp=document.createElement('input');inp.placeholder='정답을 입력하세요';inp.autocomplete='off';a.append(inp);const check=()=>{const v=inp.value.trim().toLocaleLowerCase();if(v&&(scene.answer||'').split('|').some(x=>x.trim().toLocaleLowerCase()===v))next(scene.next);else $('notice').textContent=scene.hint||'정답이 아닙니다. 다시 시도하세요.'};button('정답 확인',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}else{for(const c of scene.choices||[])button(c.text||'계속',()=>next(c.next));if(!(scene.choices||[]).length)$('notice').textContent='연결된 선택지가 없습니다.'}}
$('reset').onclick=()=>{if(!game)return;if(confirm('진행 기록을 지우고 처음부터 시작할까요?')){sceneId=game.start;render()}};
</script></body></html>
