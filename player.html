<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Player</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#f1f2fc;background:#0d111c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(100%,740px);background:#1a2030;border:1px solid #343d54;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 18px 65px #0006}h1{font-size:20px}h2{font-size:16px;color:#b9c3dd}p.story{white-space:pre-wrap;line-height:1.9;min-height:145px;font-size:18px}button,input{font:inherit;width:100%;padding:14px;border-radius:12px;margin:6px 0}button{border:1px solid #646d98;background:#343c62;color:white;cursor:pointer}button:hover{background:#505c90}input{background:#101727;border:1px solid #67708a;color:white}.muted{color:#aab3c7;font-size:13px}.novel{background:linear-gradient(145deg,#34324d,#171d2c)}.chat{background:#192b37}.explore{background:#332b29}.text{background:#2b2928}.detective{background:#302a36}.terminal{background:#071b13;color:#91e9b0;font-family:monospace}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto;padding:8px 12px}.hide{display:none}.end{text-align:center;font-size:24px;padding:20px}
</style></head><body><main class="shell" id="shell"><div class="top"><h1 id="title">게임 불러오는 중…</h1><button id="reset" class="hide">처음부터</button></div><h2 id="chapter"></h2><p id="story" class="story"></p><div id="actions"></div><p id="notice" class="muted"></p></main><script src="firebase-config.js"></script><script src="cloud.js"></script><script>
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let game,sceneId;const storageKey='storyPlayer:'+id;const error=s=>{$('title').textContent='게임을 열 수 없습니다';$('notice').textContent=s};const esc=s=>String(s||'');
(async()=>{if(!id)return error('게임 링크에 id가 없습니다.');try{const cloud=await StoryCloud;if(!cloud)return error('Firebase 설정이 필요합니다.');const snap=await cloud.getDoc(cloud.doc(cloud.db,'games',id));if(!snap.exists())return error('게임이 없거나 비공개 상태입니다.');game=snap.data();if(!game.published)return error('비공개 게임입니다.');sceneId=localStorage.getItem(storageKey)||game.start;render()}catch(e){error('게임을 불러오지 못했습니다. 공개 여부와 Firebase 규칙을 확인하세요. '+e.message)}})();
function render(){const scene=game.scenes.find(s=>s.id===sceneId);if(!scene){sceneId=game.start;localStorage.removeItem(storageKey);return render()}localStorage.setItem(storageKey,sceneId);$('shell').className='shell '+(scene.style||'novel');$('title').textContent=game.title;$('chapter').textContent=scene.title;$('story').textContent=scene.body||'';$('reset').classList.remove('hide');$('notice').textContent='진행 상황은 이 브라우저에 자동 저장됩니다.';const a=$('actions');a.replaceChildren();const button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)};const next=(target)=>{if(!target||!game.scenes.some(s=>s.id===target))return $('notice').textContent='다음 장면이 연결되지 않았습니다.';sceneId=target;render()};if(scene.type==='ending'){const d=document.createElement('div');d.className='end';d.textContent='✦ ENDING ✦';a.append(d);button('다시 시작',()=>{sceneId=game.start;render()})}else if(scene.type==='puzzle'){const inp=document.createElement('input');inp.placeholder='정답을 입력하세요';inp.autocomplete='off';a.append(inp);const check=()=>{const v=inp.value.trim().toLocaleLowerCase();if(v&&(scene.answer||'').split('|').some(x=>x.trim().toLocaleLowerCase()===v))next(scene.next);else $('notice').textContent=scene.hint||'정답이 아닙니다. 다시 시도하세요.'};button('정답 확인',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}else{for(const c of scene.choices||[])button(c.text||'계속',()=>next(c.next));if(!(scene.choices||[]).length)$('notice').textContent='연결된 선택지가 없습니다.'}}
$('reset').onclick=()=>{if(!game)return;if(confirm('진행 기록을 지우고 처음부터 시작할까요?')){sceneId=game.start;render()}};
</script></body></html>
