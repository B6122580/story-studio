<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Player</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#f1f2fc;background:#0d111c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(100%,740px);background:#1a2030;border:1px solid #343d54;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 18px 65px #0006}h1{font-size:20px}h2{font-size:16px;color:#b9c3dd}p.story{white-space:pre-wrap;line-height:1.9;min-height:145px;font-size:18px}button,input{font:inherit;width:100%;padding:14px;border-radius:12px;margin:6px 0}button{border:1px solid #646d98;background:#343c62;color:white;cursor:pointer}button:hover{background:#505c90}input{background:#101727;border:1px solid #67708a;color:white}.muted{color:#aab3c7;font-size:13px}.novel{background:linear-gradient(145deg,#34324d,#171d2c)}.chat{background:#192b37}.explore{background:#332b29}.text{background:#2b2928}.detective{background:#302a36}.terminal{background:#071b13;color:#91e9b0;font-family:monospace}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto;padding:8px 12px}.hide{display:none}.end{text-align:center;font-size:24px;padding:20px}

/* Story Studio scene design */
.design-preview{position:relative;isolation:isolate;overflow:hidden;background-color:var(--design-bg,#1a2030);background-image:var(--design-image,none);background-size:cover;background-position:center;color:var(--design-text,#f1f2fc);font-family:var(--design-font,system-ui);aspect-ratio:var(--design-ratio,auto)}
.design-preview:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--design-overlay,.35));z-index:-1;pointer-events:none}
.design-portrait{display:block;width:min(42%,260px);max-height:40vh;object-fit:contain;object-position:bottom;margin:0 auto 12px}
.design-preview .scene,.design-preview .story{color:inherit;text-align:var(--design-align,left);font-size:var(--design-size,18px)}
.design-preview .scene{white-space:pre-wrap}
.design-preview h1,.design-preview h2,.design-preview .muted{color:inherit}
.design-preview button{background:var(--design-button,#343c62);color:var(--design-text,#f1f2fc)}
.design-preview .design-dialog{background:rgba(8,12,23,.68);padding:14px;border-radius:12px;backdrop-filter:blur(3px)}
.design-preview .design-dialog .scene,.design-preview .design-dialog .story{margin-top:8px}
.design-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.design-fields .wide{grid-column:1/-1}
@media(max-width:600px){.design-fields{grid-template-columns:1fr}.design-preview{aspect-ratio:auto;min-height:360px}.design-portrait{max-height:28vh}}

/* Independent typography and embedded image controls */
.design-preview h1,.design-preview h2,.design-preview .scene-heading{color:var(--design-title-color,var(--design-text,#f1f2fc));font-family:var(--design-title-font,var(--design-font,system-ui));font-size:var(--design-title-size,20px)}
.design-preview .scene,.design-preview .story{color:var(--design-body-color,var(--design-text,#f1f2fc));font-family:var(--design-body-font,var(--design-font,system-ui));font-size:var(--design-body-size,var(--design-size,18px))}
.design-preview button{color:var(--design-choice-color,var(--design-text,#f1f2fc));font-family:var(--design-choice-font,var(--design-font,system-ui));font-size:var(--design-choice-size,18px)}
.design-preview .muted{color:var(--design-title-color,var(--design-text,#f1f2fc))}
.upload-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload-tools input[type=file]{max-width:100%;font-size:12px}.upload-tools button{flex:0 0 auto}.upload-note{font-size:12px;color:#abb7d3;overflow-wrap:anywhere}
#nameSetup label{display:block;margin:12px 0 4px;color:#c5cce1;font-size:14px}#nameSetup input{margin:3px 0 10px}#nameSetup p{line-height:1.7}

/* Compact qualitative status chips */
.status-strip{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}.status-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(76,83,113,.65);border:1px solid rgba(190,198,225,.18);border-radius:10px;padding:7px 10px;font-size:12px;color:inherit}.status-chip .status-symbol{font-size:16px}.status-config-row{display:grid;grid-template-columns:70px 1fr 1.4fr;gap:6px;margin:7px 0}.status-choice-editor{padding:9px;margin:6px 0 12px;background:#161b2a;border-radius:9px}.status-choice-editor label{margin-top:5px}.status-choice-editor select{font-size:12px}.status-choice-editor .status-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:600px){.status-config-row{grid-template-columns:60px 1fr}.status-config-row input:last-child{grid-column:1/-1}}
</style></head><body><main class="shell" id="shell"><div class="top"><h1 id="title">게임 불러오는 중…</h1><button id="reset" class="hide">처음부터</button></div><h2 id="chapter"></h2><div class="design-dialog"><p id="story" class="story"></p></div><div id="nameSetup" class="hide"></div><div id="actions"></div><p id="notice" class="muted"></p></main><script src="firebase-config.js"></script><script src="cloud.js"></script><script>
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let game,sceneId,playerNames=null;const storageKey='storyPlayer:'+id;const error=s=>{$('title').textContent='게임을 열 수 없습니다';$('notice').textContent=s};const esc=s=>String(s||'');
(async()=>{if(!id)return error('게임 링크에 id가 없습니다.');try{const cloud=await StoryCloud;if(!cloud)return error('Firebase 설정이 필요합니다.');const snap=await cloud.getDoc(cloud.doc(cloud.db,'publicGames',id));if(!snap.exists())return error('게임이 없거나 비공개 상태입니다.');game=snap.data();if(!game.published)return error('비공개 게임입니다.');sceneId=localStorage.getItem(storageKey)||game.start;initNames()}catch(e){error('게임을 불러오지 못했습니다. 공개 여부와 Firebase 규칙을 확인하세요. '+e.message)}})();

function nameConfig(){return {player:{defaultName:game.nameSettings?.player?.defaultName||'플레이어',allowChange:!!game.nameSettings?.player?.allowChange},target:{defaultName:game.nameSettings?.target?.defaultName||'상대',allowChange:!!game.nameSettings?.target?.allowChange}}}
const nameKey=storageKey+':names';
function koreanParticle(word,pair){const [yes,no]=pair.split('/');if(!no)return yes||'';const c=Array.from(word||'').pop()||'';const n=c.charCodeAt(0);return n>=0xAC00&&n<=0xD7A3&&((n-0xAC00)%28!==0)?yes:no}
function replaceNames(s){return String(s??'').replace(/\\{(player|target)(?::([^{}]+))?\\}/g,(_,key,particle)=>{const name=playerNames?.[key]||nameConfig()[key].defaultName;return name+(particle?koreanParticle(name,particle):'')})}
function initNames(force=false){
 const cfg=nameConfig();let stored=null;try{stored=JSON.parse(localStorage.getItem(nameKey))}catch{}
 if(!force&&stored&&typeof stored.player==='string'&&typeof stored.target==='string'){playerNames={player:cfg.player.allowChange?stored.player:cfg.player.defaultName,target:cfg.target.allowChange?stored.target:cfg.target.defaultName};render();return}
 if(!cfg.player.allowChange&&!cfg.target.allowChange){playerNames={player:cfg.player.defaultName,target:cfg.target.defaultName};render();return}
 $('shell').className='shell';$('shell').style.cssText='';$('shell').querySelectorAll('.design-portrait').forEach(x=>x.remove());$('shell').querySelectorAll('.status-strip').forEach(x=>x.remove());$('title').textContent=game.title;$('chapter').textContent='이름 설정';$('story').textContent='이야기를 시작하기 전에 이름을 정해주세요.';$('actions').replaceChildren();$('reset').classList.add('hide');$('notice').textContent='';
 const root=$('nameSetup');root.classList.remove('hide');root.replaceChildren();const inputs={};
 for(const [key,label] of [['player','플레이어 이름'],['target','공략 캐릭터 이름']]){
   const setting=cfg[key];const l=document.createElement('label');l.textContent=label;root.append(l);
   if(setting.allowChange){const input=document.createElement('input');input.maxLength=20;input.value=stored?.[key]||setting.defaultName;input.placeholder=label;input.autocomplete='off';root.append(input);inputs[key]=input}
   else {const fixed=document.createElement('p');fixed.textContent=setting.defaultName+' (고정)';root.append(fixed)}
 }
 const btn=document.createElement('button');btn.textContent='게임 시작하기';btn.onclick=()=>{const result={};for(const key of ['player','target']){result[key]=cfg[key].allowChange?(inputs[key].value.trim()||cfg[key].defaultName):cfg[key].defaultName;if(result[key].length>20){$('notice').textContent='이름은 20자 이하로 입력해 주세요.';return}}playerNames=result;localStorage.setItem(nameKey,JSON.stringify(result));root.classList.add('hide');render()};root.append(btn)
}
const designDefaults={background:'',portrait:'',bgColor:'#1a2030',textColor:'#f1f2fc',buttonColor:'#343c62',fontSize:18,ratio:'auto',font:'system',align:'left',overlay:35};
const designFields={background:'designBackground',portrait:'designPortrait',bgColor:'designBgColor',textColor:'designTextColor',buttonColor:'designButtonColor',fontSize:'designFontSize',ratio:'designRatio',font:'designFont',align:'designAlign',overlay:'designOverlay'};
function safeDesignUrl(value){if(typeof value==='string' && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value))return value;try{if(!value)return '';const u=new URL(value);return u.protocol==='https:'?u.href:''}catch{return ''}}
function getDesign(s){const d={...designDefaults,...(s.design||{})};return {titleColor:d.titleColor||d.textColor,titleFont:d.titleFont||d.font,titleSize:d.titleSize||20,bodyColor:d.bodyColor||d.textColor,bodyFont:d.bodyFont||d.font,bodySize:d.bodySize||d.fontSize,choiceColor:d.choiceColor||d.textColor,choiceFont:d.choiceFont||d.font,choiceSize:d.choiceSize||d.fontSize,...d}}
function applyDesign(el,s){const d=getDesign(s);const color=(v,def)=>/^#[0-9a-fA-F]{6}$/.test(v)?v:def;el.classList.add('design-preview');el.style.setProperty('--design-bg',color(d.bgColor,'#1a2030'));el.style.setProperty('--design-text',color(d.textColor,'#f1f2fc'));el.style.setProperty('--design-button',color(d.buttonColor,'#343c62'));el.style.setProperty('--design-image',safeDesignUrl(d.background)?`url("${safeDesignUrl(d.background)}")`:'none');el.style.setProperty('--design-overlay',String(Math.max(0,Math.min(.85,(Number(d.overlay)||0)/100))));el.style.setProperty('--design-size',Math.max(12,Math.min(36,Number(d.fontSize)||18))+'px');el.style.setProperty('--design-ratio',['auto','16/9','4/3','9/16','1/1'].includes(d.ratio)?d.ratio:'auto');el.style.setProperty('--design-align',['left','center','right'].includes(d.align)?d.align:'left');el.style.setProperty('--design-font',d.font==='serif'?"Georgia, 'Batang', serif":d.font==='mono'?'monospace':'system-ui, sans-serif');const font=v=>v==='serif'?"Georgia, 'Batang', serif":v==='mono'?'monospace':'system-ui, sans-serif';for(const part of ['title','body','choice']){el.style.setProperty('--design-'+part+'-color',color(d[part+'Color'],d.textColor));el.style.setProperty('--design-'+part+'-font',font(d[part+'Font']));el.style.setProperty('--design-'+part+'-size',Math.max(12,Math.min(56,Number(d[part+'Size'])||18))+'px')}const img=safeDesignUrl(d.portrait);if(img){const portrait=document.createElement('img');portrait.src=img;portrait.alt='캐릭터 이미지';portrait.className='design-portrait';const target=el.querySelector('.design-dialog')||el.querySelector('.scene');if(target)target.before(portrait)}}


const STATUS_DEFAULTS=[{icon:'🌡️',name:'체온',initial:'열이 높음'},{icon:'🌙',name:'피로',initial:'많이 피곤함'},{icon:'♥',name:'친밀감',initial:'조금 어색함'},{icon:'♡',name:'의존',initial:'간호를 거절함'}];
function statusConfig(g){const c=g.statusSettings||{};return {enabled:!!c.enabled,items:(c.items||STATUS_DEFAULTS).slice(0,4).map((x,i)=>({icon:String(x.icon??STATUS_DEFAULTS[i].icon).slice(0,8),name:String(x.name??STATUS_DEFAULTS[i].name).slice(0,30),initial:String(x.initial??STATUS_DEFAULTS[i].initial).slice(0,70)}))}}
function initialStatuses(g){return statusConfig(g).items.map(x=>x.initial)}
function statusAfter(g,values,choice){const result=[...values];for(let i=0;i<4;i++){const v=choice?.statusChanges?.[i];if(typeof v==='string'&&v.trim())result[i]=v.trim().slice(0,70)}return result}
function statusAllowed(choice,values){const idx=Number(choice?.statusCondition?.index);const required=choice?.statusCondition?.value;return !required||!Number.isInteger(idx)||idx<0||idx>3||values[idx]===required}
function statusChips(g,values){const cfg=statusConfig(g);if(!cfg.enabled)return '';return '<div class="status-strip" aria-label="현재 상태">'+cfg.items.map((x,i)=>values[i]?'<span class="status-chip"><span class="status-symbol">'+statusEscape(x.icon)+'</span><span>'+statusEscape(values[i])+'</span></span>':'').join('')+'</div>'}
function statusEscape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const statusKey=storageKey+':status';let currentStatuses=null;
function loadStatuses(){try{const saved=JSON.parse(localStorage.getItem(statusKey));return Array.isArray(saved)&&saved.length===4?saved:initialStatuses(game)}catch{return initialStatuses(game)}}
function resetStatuses(){currentStatuses=initialStatuses(game);localStorage.removeItem(statusKey)}
function render(){$('nameSetup').classList.add('hide');const scene=game.scenes.find(s=>s.id===sceneId);if(!scene){sceneId=game.start;localStorage.removeItem(storageKey);return render()}localStorage.setItem(storageKey,sceneId);if(!currentStatuses)currentStatuses=loadStatuses();$('shell').className='shell '+(scene.style||'novel');$('shell').style.cssText='';$('shell').querySelectorAll('.design-portrait').forEach(x=>x.remove());$('title').textContent=game.title;$('chapter').textContent=scene.title;$('story').textContent=replaceNames(scene.body||'');$('shell').querySelectorAll('.status-strip').forEach(x=>x.remove());if(statusConfig(game).enabled)$('chapter').insertAdjacentHTML('afterend',statusChips(game,currentStatuses));applyDesign($('shell'),scene);$('reset').classList.remove('hide');$('notice').textContent='';const a=$('actions');a.replaceChildren();const button=(label,fn)=>{const b=document.createElement('button');b.textContent=replaceNames(label);b.onclick=fn;a.append(b)};const next=(target)=>{if(!target||!game.scenes.some(s=>s.id===target))return $('notice').textContent='다음 장면이 연결되지 않았습니다.';sceneId=target;render()};if(scene.type==='ending'){const d=document.createElement('div');d.className='end';d.textContent='✦ ENDING ✦';a.append(d);button('다시 시작',()=>{sceneId=game.start;resetStatuses();localStorage.removeItem(nameKey);playerNames=null;initNames(true)})}else if(scene.type==='puzzle'){const inp=document.createElement('input');inp.placeholder='정답을 입력하세요';inp.autocomplete='off';a.append(inp);const check=()=>{const v=inp.value.trim().toLocaleLowerCase();if(v&&(scene.answer||'').split('|').some(x=>x.trim().toLocaleLowerCase()===v))next(scene.next);else $('notice').textContent=scene.hint||'정답이 아닙니다. 다시 시도하세요.'};button('정답 확인',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}else{for(const c of scene.choices||[]){if(statusConfig(game).enabled&&!statusAllowed(c,currentStatuses))continue;button(c.text||'계속',()=>{if(!c.next||!game.scenes.some(s=>s.id===c.next)){next(c.next);return}if(statusConfig(game).enabled){currentStatuses=statusAfter(game,currentStatuses,c);localStorage.setItem(statusKey,JSON.stringify(currentStatuses))}next(c.next)})}if(!(scene.choices||[]).length)$('notice').textContent='연결된 선택지가 없습니다.'}}
$('reset').onclick=()=>{if(!game)return;if(confirm('진행 기록을 지우고 처음부터 시작할까요?')){sceneId=game.start;resetStatuses();localStorage.removeItem(nameKey);playerNames=null;initNames(true)}};
</script></body></html>
